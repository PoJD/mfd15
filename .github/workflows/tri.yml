name: tri

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: validate TRI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: validator tests
        working-directory: tools
        run: python -m unittest discover -p 'test_*.py' -v

      # A TRI file has no build, so this is the only automatic check it can
      # get. An error otherwise only shows up on the display in the car.
      - name: production file
        run: python tools/validate_tri.py tri/S-AQY.TRI

      - name: reference files
        run: python tools/validate_tri.py tri/reference/*.TRI
